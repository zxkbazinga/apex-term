name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runs-on: macos-latest
            artifact-name: macos-artifacts
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: Windows x64
            runs-on: windows-latest
            artifact-name: windows-x64-artifacts
            artifact-path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - platform: Linux x64
            runs-on: ubuntu-22.04
            artifact-name: linux-x64-artifacts
            artifact-path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'Linux x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - name: Install Node dependencies
        run: npm ci

      - name: Set app version from release tag
        if: runner.os != 'Windows'
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Set app version from release tag on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm version $env:GITHUB_REF_NAME.Substring(1) --no-git-tag-version --allow-same-version

      - name: Build Tauri App
        run: npm run tauri build

      - name: Generate release notes
        if: matrix.platform == 'macOS'
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REPOSITORY_URL: https://github.com/zxkbazinga/apex-term.git
          RELEASE_NOTES_PATH: src-tauri/target/release/bundle/dmg/release-notes.md
        run: npm run release:notes

      - name: Verify bundled OpenSSL is statically linked
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          app_binary="$(find src-tauri/target/release/bundle/macos -type f -path '*/Contents/MacOS/*' -print -quit)"
          if [ -z "$app_binary" ]; then
            echo "Could not find the macOS app executable"
            exit 1
          fi
          if otool -L "$app_binary" | grep -E 'lib(ssl|crypto)'; then
            echo "The macOS app has a dynamic OpenSSL dependency"
            exit 1
          fi

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-path }}
            ${{ matrix.platform == 'macOS' && 'src-tauri/target/release/bundle/dmg/release-notes.md' || '' }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v6
        with:
          name: macos-artifacts
          path: artifacts/macos

      - name: Download Windows x64 artifacts
        uses: actions/download-artifact@v6
        with:
          name: windows-x64-artifacts
          path: artifacts/windows-x64

      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@v6
        with:
          name: linux-x64-artifacts
          path: artifacts/linux-x64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: artifacts/macos/release-notes.md
          files: |
            artifacts/macos/*.dmg
            artifacts/windows-x64/*.msi
            artifacts/windows-x64/*.exe
            artifacts/linux-x64/*.AppImage
            artifacts/linux-x64/*.deb
            artifacts/linux-x64/*.rpm
          fail_on_unmatched_files: true
